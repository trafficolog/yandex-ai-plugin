name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compute validation change scope
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/changed-files.txt
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
          else
            exit 0
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git ls-files > /tmp/changed-files.txt
          else
            git diff --name-only "$base" "${{ github.sha }}" > /tmp/changed-files.txt
          fi
          cat /tmp/changed-files.txt
      - name: Validate repository contracts
        run: python scripts/validate_repo.py --changed-files-file /tmp/changed-files.txt
      - name: Run repository tests
        run: python -m unittest discover -s tests -v

  changes:
    name: Detect affected plugins
    runs-on: ubuntu-latest
    outputs:
      direct: ${{ steps.detect.outputs.direct }}
      metrika: ${{ steps.detect.outputs.metrika }}
      webmaster: ${{ steps.detect.outputs.webmaster }}
      wordstat: ${{ steps.detect.outputs.wordstat }}
      search: ${{ steps.detect.outputs.search }}
      seo: ${{ steps.detect.outputs.seo }}
      marketing: ${{ steps.detect.outputs.marketing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect plugin/shared changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "direct=true" >> "$GITHUB_OUTPUT"
            echo "metrika=true" >> "$GITHUB_OUTPUT"
            echo "webmaster=true" >> "$GITHUB_OUTPUT"
            echo "wordstat=true" >> "$GITHUB_OUTPUT"
            echo "search=true" >> "$GITHUB_OUTPUT"
            echo "seo=true" >> "$GITHUB_OUTPUT"
            echo "marketing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
          fi

          printf '%s\n' "$changed_files"
          shared='^(\.agents/|\.claude-plugin/|\.github/workflows/|scripts/(validate_repo|contract_controls|check_reference_freshness)\.py$|docs/(PLUGIN_STANDARD(\.en)?\.md|CONTRACT_MATRIX\.json)$|docs/superpowers/(specs|plans)/|tests/)'

          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-direct/)|$shared"; then
            echo "direct=true" >> "$GITHUB_OUTPUT"
          else
            echo "direct=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-metrika/)|$shared"; then
            echo "metrika=true" >> "$GITHUB_OUTPUT"
          else
            echo "metrika=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-webmaster/)|$shared"; then
            echo "webmaster=true" >> "$GITHUB_OUTPUT"
          else
            echo "webmaster=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-wordstat/)|$shared"; then
            echo "wordstat=true" >> "$GITHUB_OUTPUT"
          else
            echo "wordstat=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-search/)|$shared"; then
            echo "search=true" >> "$GITHUB_OUTPUT"
          else
            echo "search=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-seo/|plugins/yandex-wordstat/|plugins/yandex-search/|plugins/yandex-webmaster/|plugins/yandex-metrika/)|$shared"; then
            echo "seo=true" >> "$GITHUB_OUTPUT"
          else
            echo "seo=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq "^(plugins/yandex-marketing/|plugins/yandex-direct/|plugins/yandex-metrika/|plugins/yandex-wordstat/|plugins/yandex-search/)|$shared"; then
            echo "marketing=true" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=false" >> "$GITHUB_OUTPUT"
          fi

  direct:
    name: Yandex Direct plugin
    needs: [validate, changes]
    if: needs.changes.outputs.direct == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Direct regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Direct helpers
        run: python -m py_compile scripts/yd_api.py scripts/yd_report.py

  metrika:
    name: Yandex Metrika plugin
    needs: [validate, changes]
    if: needs.changes.outputs.metrika == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-metrika
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Metrika tests
        run: python -m unittest discover -s tests -v
      - name: Compile Metrika helpers
        run: python -m py_compile scripts/_http.py scripts/ym_api.py scripts/ym_report.py scripts/ym_logs.py scripts/ym_import.py

  webmaster:
    name: Yandex Webmaster plugin
    needs: [validate, changes]
    if: needs.changes.outputs.webmaster == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-webmaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Webmaster tests
        run: python -m unittest discover -s tests -v
      - name: Compile Webmaster helpers
        run: python -m py_compile scripts/_http.py scripts/yw_api.py scripts/yw_queries.py scripts/yw_indexing.py scripts/yw_recrawl.py scripts/yw_sitemaps.py scripts/yw_feeds.py scripts/yw_export.py

  wordstat:
    name: Yandex Wordstat plugin
    needs: [validate, changes]
    if: needs.changes.outputs.wordstat == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-wordstat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Wordstat tests
        run: python -m unittest discover -s tests -v
      - name: Compile Wordstat helpers
        run: python -m py_compile scripts/_http.py scripts/ywstat_api.py scripts/ywstat_top.py scripts/ywstat_semantics.py scripts/ywstat_dynamics.py scripts/ywstat_regions.py scripts/ywstat_trends.py

  search:
    name: Yandex Search plugin
    needs: [validate, changes]
    if: needs.changes.outputs.search == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Search tests
        run: python -m unittest discover -s tests -v
      - name: Compile Search helpers
        run: python -m py_compile scripts/_http.py scripts/ys_api.py scripts/ys_request.py scripts/ys_parse.py scripts/ys_async.py scripts/ys_batch.py scripts/ys_serp.py scripts/ys_overlap.py scripts/ys_compare.py

  seo:
    name: Yandex SEO plugin
    needs: [validate, changes]
    if: needs.changes.outputs.seo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-seo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run SEO tests
        run: python -m unittest discover -s tests -v
      - name: Compile SEO helpers
        run: python -m py_compile scripts/seo_context.py scripts/seo_bundle.py scripts/seo_join.py scripts/seo_quality.py scripts/seo_opportunities.py scripts/seo_cannibalization.py scripts/seo_prioritize.py

  marketing:
    name: Yandex Marketing plugin
    needs: [validate, changes]
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/yandex-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Marketing tests
        run: python -m unittest discover -s tests -v
      - name: Compile Marketing helpers
        run: python -m py_compile scripts/marketing_context.py scripts/marketing_bundle.py scripts/marketing_join.py scripts/marketing_quality.py scripts/marketing_performance.py scripts/marketing_demand.py scripts/marketing_opportunities.py scripts/marketing_prioritize.py
