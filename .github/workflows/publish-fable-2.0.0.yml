name: Publish FABLE 2.0.0 releases

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: fable-2.0.0-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified FABLE 2.0.0 releases
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect immutable release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tags=(yandex-direct-v2.0.0 yandex-metrika-v2.0.0 yandex-webmaster-v2.0.0)
          candidates=()
          published=0
          drafts=0

          for tag in "${tags[@]}"; do
            if state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
              if [[ "$is_draft" == "true" ]]; then
                if git show-ref --verify --quiet "refs/tags/$tag"; then
                  echo "Draft release $tag unexpectedly has a Git tag." >&2
                  exit 1
                fi
                candidates+=("$target")
                drafts=$((drafts + 1))
              else
                if [[ "$is_immutable" != "true" ]]; then
                  echo "Published release $tag is not immutable." >&2
                  exit 1
                fi
                git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
                candidates+=("$(git rev-list -n 1 "$tag")")
                published=$((published + 1))
              fi
            elif git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Standalone tag $tag exists without a GitHub Release." >&2
              exit 1
            fi
          done

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            if [[ "$live_main" != "$TARGET_SHA" ]]; then
              echo "Stale main CI run: live=$live_main target=$TARGET_SHA" >&2
              exit 1
            fi
            release_target="$TARGET_SHA"
            initial=true
          else
            release_target="${candidates[0]}"
            for sha in "${candidates[@]}"; do
              if [[ "$sha" != "$release_target" ]]; then
                echo "Existing FABLE 2.0.0 release state spans multiple commits: ${candidates[*]}" >&2
                exit 1
              fi
            done
            if ! git merge-base --is-ancestor "$release_target" "$live_main"; then
              echo "Existing release target $release_target is not an ancestor of live main $live_main." >&2
              exit 1
            fi
            initial=false
          fi

          if [[ "$published" -eq 3 && "$drafts" -eq 0 ]]; then
            complete=true
          else
            complete=false
          fi
          echo "release_target=$release_target" >> "$GITHUB_OUTPUT"
          echo "initial=$initial" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Verify exact release target
        if: steps.state.outputs.complete != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_TARGET^{commit}"
          for plugin in yandex-direct yandex-metrika yandex-webmaster; do
            git show "$RELEASE_TARGET:plugins/$plugin/.codex-plugin/plugin.json" | grep -F '"version": "2.0.0"'
            git show "$RELEASE_TARGET:plugins/$plugin/.claude-plugin/plugin.json" | grep -F '"version": "2.0.0"'
            git show "$RELEASE_TARGET:plugins/$plugin/CHANGELOG.md" | grep -F '## [2.0.0]'
          done

          WT="$(mktemp -d)"
          trap 'git worktree remove --force "$WT" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$WT" "$RELEASE_TARGET"
          (cd "$WT" && python scripts/validate_repo.py && python -m unittest discover -s tests -v)
          for plugin in yandex-direct yandex-metrika yandex-webmaster; do
            (cd "$WT/plugins/$plugin" && python -m unittest discover -s tests -v && python -m compileall -q scripts)
          done

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${{ steps.state.outputs.initial }}" == "true" ]]; then
            if [[ "$live_main" != "$TARGET_SHA" || "$RELEASE_TARGET" != "$TARGET_SHA" ]]; then
              echo "Late stale-main guard failed." >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$RELEASE_TARGET" "$live_main"; then
            echo "Recovery target is no longer an ancestor of live main." >&2
            exit 1
          fi

      - name: Publish immutable service releases
        if: steps.state.outputs.complete != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/direct.md <<'EOF'
          Yandex Direct 2.0.0 — FABLE 5.1 safety and helper-hardening release.

          - Exact preview-bound approval is required for consequential writes.
          - OAuth is environment-only via YANDEX_DIRECT_TOKEN.
          - Explicit approval-bound sandbox support.
          - Strict documented v5 service allowlist.
          - Bounded, typed HTTP errors including truncated-body handling.
          - No automatic retry for consequential POST writes.
          - RequestId and Units metadata remain separate from the API payload.
          EOF
          cat > /tmp/metrika.md <<'EOF'
          Yandex Metrika 2.0.0 — FABLE 5.1 write-safety release.

          - Consequential writes require exact preview-bound approval.
          - Management writes, Logs create/clean and imports fail closed without matching approval.
          - Import approvals bind the SHA-256 digest of exact file bytes.
          - API/account/file content is data, not authorization.
          EOF
          cat > /tmp/webmaster.md <<'EOF'
          Yandex Webmaster 2.0.0 — FABLE 5.1 write-safety release.

          - Consequential POST/PUT/PATCH/DELETE calls require exact preview-bound approval.
          - Approval binds method/path/query/body/API version and relevant target identity.
          - Credential-bearing URLs remain redacted while credential changes invalidate approval.
          - Bounded HTTP error responses are closed deterministically.
          EOF

          remote_tag_exists() {
            local tag="$1" rc
            set +e
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            rc=$?
            set -e
            case "$rc" in
              0) return 0 ;;
              2) return 1 ;;
              *)
                echo "Unable to determine remote tag state for $tag (git ls-remote rc=$rc)." >&2
                exit "$rc"
                ;;
            esac
          }

          rollback_published_release() {
            local tag="$1" original_rc="$2" probe_rc
            trap - ERR
            set +e
            echo "Publication verification failed for $tag; attempting fail-closed cleanup." >&2
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Rollback residue: release $tag remains." >&2
            fi
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            probe_rc=$?
            if [[ "$probe_rc" -eq 0 ]]; then
              echo "Rollback residue: tag $tag remains." >&2
            elif [[ "$probe_rc" -ne 2 ]]; then
              echo "Rollback verification could not determine tag state for $tag (rc=$probe_rc)." >&2
            fi
            exit "$original_rc"
          }

          publish_one() {
            local tag="$1" title="$2" notes="$3"
            local state="" is_draft="" is_immutable="" target="" tag_sha=""

            if state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
              if [[ "$target" != "$RELEASE_TARGET" ]]; then
                echo "$tag targets $target, expected $RELEASE_TARGET." >&2
                exit 1
              fi
              if [[ "$is_draft" != "true" ]]; then
                if [[ "$is_immutable" != "true" ]]; then
                  echo "$tag is published but mutable." >&2
                  exit 1
                fi
                git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
                tag_sha="$(git rev-list -n 1 "$tag")"
                [[ "$tag_sha" == "$RELEASE_TARGET" ]] || { echo "$tag points to $tag_sha." >&2; exit 1; }
                echo "$tag already published at exact target."
                return 0
              fi
              if remote_tag_exists "$tag"; then
                echo "Draft $tag unexpectedly has a remote tag." >&2
                exit 1
              fi
            else
              if remote_tag_exists "$tag"; then
                echo "Standalone remote tag $tag exists." >&2
                exit 1
              fi
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$RELEASE_TARGET" --title "$title" --notes-file "$notes"
              state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv')"
              IFS=$'\t' read -r is_draft target <<< "$state"
              [[ "$is_draft" == "true" && "$target" == "$RELEASE_TARGET" ]] || { echo "Invalid draft reservation for $tag." >&2; exit 1; }
              if remote_tag_exists "$tag"; then
                echo "Draft reservation $tag unexpectedly materialized a tag." >&2
                exit 1
              fi
            fi

            trap 'rc=$?; rollback_published_release "$tag" "$rc"' ERR
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --target "$RELEASE_TARGET" --title "$title" --notes-file "$notes"
            state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
            IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
            [[ "$is_draft" != "true" && "$target" == "$RELEASE_TARGET" ]] || { echo "Invalid published state for $tag." >&2; false; }
            if [[ "$is_immutable" != "true" ]]; then
              echo "$tag did not become immutable." >&2
              false
            fi
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            tag_sha="$(git rev-list -n 1 "$tag")"
            [[ "$tag_sha" == "$RELEASE_TARGET" ]] || { echo "$tag points to $tag_sha, expected $RELEASE_TARGET." >&2; false; }
            trap - ERR
          }

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${{ steps.state.outputs.initial }}" == "true" ]]; then
            [[ "$live_main" == "$TARGET_SHA" && "$RELEASE_TARGET" == "$TARGET_SHA" ]] || { echo "Late publication stale-main guard failed." >&2; exit 1; }
          else
            git merge-base --is-ancestor "$RELEASE_TARGET" "$live_main" || { echo "Late recovery ancestry guard failed." >&2; exit 1; }
          fi

          publish_one yandex-direct-v2.0.0 "Yandex Direct 2.0.0" /tmp/direct.md
          publish_one yandex-metrika-v2.0.0 "Yandex Metrika 2.0.0" /tmp/metrika.md
          publish_one yandex-webmaster-v2.0.0 "Yandex Webmaster 2.0.0" /tmp/webmaster.md

      - name: Verify final release set
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in yandex-direct-v2.0.0 yandex-metrika-v2.0.0 yandex-webmaster-v2.0.0; do
            state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
            IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
            [[ "$is_draft" != "true" && "$is_immutable" == "true" && "$target" == "$RELEASE_TARGET" ]]
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            [[ "$(git rev-list -n 1 "$tag")" == "$RELEASE_TARGET" ]]
          done
