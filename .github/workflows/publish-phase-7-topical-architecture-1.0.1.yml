name: Publish Phase 7 Topical Architecture 1.0.1 releases

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified Phase 7 patch releases
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect immutable Phase 7 patch release state
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tags=(
            "phase-7-topical-architecture-1.0.1"
            "yandex-wordstat-v1.1.1"
            "yandex-seo-v1.1.1"
          )
          release_count=0
          release_shas=()

          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_count=$((release_count + 1))
              if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                echo "Release $tag exists but its tag is unavailable after fetch." >&2
                exit 1
              fi
              release_shas+=("$(git rev-list -n 1 "$tag")")
            fi
          done

          echo "release_count=$release_count" >> "$GITHUB_OUTPUT"
          printf 'release_shas=%s\n' "$(IFS=,; echo "${release_shas[*]}")" >> "$GITHUB_OUTPUT"

          if [[ "$release_count" -eq 0 ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "partial_release=false" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          released_sha="${release_shas[0]}"
          for sha in "${release_shas[@]}"; do
            if [[ "$sha" != "$released_sha" ]]; then
              echo "Existing Phase 7 patch releases point to multiple commits: ${release_shas[*]}" >&2
              exit 1
            fi
          done

          if ! git merge-base --is-ancestor "$released_sha" "$TARGET_SHA"; then
            echo "Published Phase 7 patch commit $released_sha is not an ancestor of current main $TARGET_SHA" >&2
            exit 1
          fi

          echo "released_sha=$released_sha" >> "$GITHUB_OUTPUT"
          echo "release_target_sha=$released_sha" >> "$GITHUB_OUTPUT"

          if [[ "$release_count" -eq "${#tags[@]}" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "partial_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "partial_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report already-published release set
        if: steps.release_state.outputs.already_published == 'true'
        shell: bash
        run: |
          echo "Phase 7 patch release set already published; no-op."
          echo "Published commit: ${{ steps.release_state.outputs.released_sha }}"

      - name: Report partial release recovery
        if: steps.release_state.outputs.partial_release == 'true'
        shell: bash
        run: |
          echo "Partial Phase 7 patch release set detected; resuming at immutable commit."
          echo "Release target: ${{ steps.release_state.outputs.release_target_sha }}"
          echo "Current main: $TARGET_SHA"

      - name: Verify exact release target
        if: steps.release_state.outputs.already_published != 'true'
        env:
          RELEASE_TARGET_SHA: ${{ steps.release_state.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$RELEASE_TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_TARGET_SHA" "$TARGET_SHA"
          git show "$RELEASE_TARGET_SHA:plugins/yandex-wordstat/.codex-plugin/plugin.json" | grep -F '"version": "1.1.1"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-seo/.codex-plugin/plugin.json" | grep -F '"version": "1.1.1"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-search/.codex-plugin/plugin.json" | grep -F '"version": "1.0.2"'
          git show "$RELEASE_TARGET_SHA:CHANGELOG.md" | grep -F '## [PHASE 7 1.0.1] — 2026-09-03'
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v
          python scripts/check_reference_freshness.py

      - name: Publish repository and plugin releases
        if: steps.release_state.outputs.already_published != 'true'
        env:
          RELEASE_TARGET_SHA: ${{ steps.release_state.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes_file="$3"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              existing_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$existing_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Existing release $tag points to $existing_sha, expected $RELEASE_TARGET_SHA" >&2
                exit 1
              fi
              echo "Release $tag already exists at the expected immutable commit."
              return 0
            fi

            if git show-ref --verify --quiet "refs/tags/$tag"; then
              existing_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$existing_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Existing tag $tag points to $existing_sha, expected $RELEASE_TARGET_SHA" >&2
                exit 1
              fi
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$title" \
                --notes-file "$notes_file"
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$RELEASE_TARGET_SHA" \
                --title "$title" \
                --notes-file "$notes_file"
            fi
          }

          cat > /tmp/phase7-patch.md <<'EOF'
          Phase 7 Topical Architecture 1.0.1 is a post-release contract-hardening patch.

          Published plugin matrix:
          - Yandex Direct 1.0.1 (unchanged)
          - Yandex Metrika 1.0.2 (unchanged)
          - Yandex Webmaster 1.0.3 (unchanged)
          - Yandex Wordstat 1.1.1
          - Yandex Search 1.0.2 (unchanged)
          - Yandex SEO 1.1.1
          - Yandex Marketing 1.1.0 (unchanged)

          Fixes:
          - Wordstat rejects duplicate seed identifiers so source_seed remains an unambiguous provenance key;
          - Wordstat rejects candidate-topic self-relations while retaining candidate-only ownership;
          - SEO structural nodes use an explicit field whitelist so caller decision/execution/write state cannot leak into structural_tree;
          - SEO candidate-link evidence must be list-typed before preview serialization;
          - Search ownership, transport-free SEO boundaries, and preview-only semantics are unchanged.
          EOF

          cat > /tmp/wordstat-patch.md <<'EOF'
          Yandex Wordstat 1.1.1 hardens candidate topic-map provenance:
          - duplicate seeds[].seed identifiers are rejected before phrase normalization;
          - candidate relations require distinct source and target topics;
          - source_seed remains an unambiguous provenance key;
          - Wordstat remains candidate-only and does not claim final page boundaries or internal links.
          EOF

          cat > /tmp/seo-patch.md <<'EOF'
          Yandex SEO 1.1.1 hardens Topical Architecture and Internal Linking contracts:
          - structural_tree.nodes are normalized through an explicit field whitelist;
          - caller decision, status, write, and execution_id state cannot leak into the structural artifact;
          - candidate-link evidence must be a list and malformed scalar/object payloads are rejected before preview serialization;
          - Search-owned SERP clustering, transport-free ownership, and the no-CMS-write boundary remain unchanged.
          EOF

          publish_release "phase-7-topical-architecture-1.0.1" "Phase 7 — Topical Architecture 1.0.1" /tmp/phase7-patch.md
          publish_release "yandex-wordstat-v1.1.1" "Yandex Wordstat 1.1.1" /tmp/wordstat-patch.md
          publish_release "yandex-seo-v1.1.1" "Yandex SEO 1.1.1" /tmp/seo-patch.md
