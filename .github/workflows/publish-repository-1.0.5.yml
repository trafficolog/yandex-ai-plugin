name: Publish repository 1.0.5

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: repository-1-0-5-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified repository 1.0.5 release
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect immutable release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tags=("1.0.5")
          candidates=()
          published=0
          drafts=0

          for tag in "${tags[@]}"; do
            if state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
              if [[ "$is_draft" == "true" ]]; then
                if git show-ref --verify --quiet "refs/tags/$tag"; then
                  echo "Draft release $tag unexpectedly has a Git tag." >&2
                  exit 1
                fi
                if [[ ! "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  echo "Draft release $tag has non-immutable target: $target" >&2
                  exit 1
                fi
                candidates+=("${target,,}")
                drafts=$((drafts + 1))
              else
                if [[ "$is_immutable" != "true" ]]; then
                  echo "Published release $tag is not immutable." >&2
                  exit 1
                fi
                git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
                candidates+=("$(git rev-list -n 1 "$tag")")
                published=$((published + 1))
              fi
            elif git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Standalone tag $tag exists without a GitHub Release." >&2
              exit 1
            fi
          done

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            if [[ "$live_main" != "$TARGET_SHA" ]]; then
              echo "Stale main CI run: live=$live_main target=$TARGET_SHA" >&2
              exit 1
            fi
            release_target="$TARGET_SHA"
            initial=true
          else
            release_target="${candidates[0]}"
            for sha in "${candidates[@]}"; do
              if [[ "$sha" != "$release_target" ]]; then
                echo "Existing repository 1.0.5 release state spans multiple commits: ${candidates[*]}" >&2
                exit 1
              fi
            done
            if ! git merge-base --is-ancestor "$release_target" "$live_main"; then
              echo "Existing release target $release_target is not an ancestor of live main $live_main." >&2
              exit 1
            fi
            initial=false
          fi

          if [[ "$published" -eq 1 && "$drafts" -eq 0 ]]; then
            complete=true
          else
            complete=false
          fi
          echo "release_target=$release_target" >> "$GITHUB_OUTPUT"
          echo "initial=$initial" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Verify exact release target
        if: steps.state.outputs.complete != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_TARGET^{commit}"

          verify_manifest_version() {
            local manifest_path="$1"
            local expected="$2"
            git show "$RELEASE_TARGET:$manifest_path" | python -c 'import json, sys; path=sys.argv[1]; expected=sys.argv[2]; actual=json.load(sys.stdin).get("version"); sys.exit(0 if actual == expected else f"{path} version {actual!r}, expected {expected!r}")' "$manifest_path" "$expected"
          }

          verify_manifest_version "plugins/yandex-direct/.codex-plugin/plugin.json" "2.0.1"
          verify_manifest_version "plugins/yandex-direct/.claude-plugin/plugin.json" "2.0.1"
          verify_manifest_version "plugins/yandex-metrika/.codex-plugin/plugin.json" "2.0.0"
          verify_manifest_version "plugins/yandex-metrika/.claude-plugin/plugin.json" "2.0.0"
          verify_manifest_version "plugins/yandex-webmaster/.codex-plugin/plugin.json" "2.0.0"
          verify_manifest_version "plugins/yandex-webmaster/.claude-plugin/plugin.json" "2.0.0"
          verify_manifest_version "plugins/yandex-wordstat/.codex-plugin/plugin.json" "1.1.2"
          verify_manifest_version "plugins/yandex-wordstat/.claude-plugin/plugin.json" "1.1.2"
          verify_manifest_version "plugins/yandex-search/.codex-plugin/plugin.json" "1.0.2"
          verify_manifest_version "plugins/yandex-search/.claude-plugin/plugin.json" "1.0.2"
          verify_manifest_version "plugins/yandex-seo/.codex-plugin/plugin.json" "1.1.2"
          verify_manifest_version "plugins/yandex-seo/.claude-plugin/plugin.json" "1.1.2"
          verify_manifest_version "plugins/yandex-marketing/.codex-plugin/plugin.json" "1.1.0"
          verify_manifest_version "plugins/yandex-marketing/.claude-plugin/plugin.json" "1.1.0"

          git show "$RELEASE_TARGET:CHANGELOG.md" | grep -F "## [1.0.5] — 2026-09-04"
          git show "$RELEASE_TARGET:CHANGELOG.en.md" | grep -F "## [1.0.5] — 2026-09-04"
          git show "$RELEASE_TARGET:README.md" | grep -F "release-1.0.5"
          git show "$RELEASE_TARGET:README.en.md" | grep -F "release-1.0.5"

          for doc in \
            docs/GETTING_STARTED.md \
            docs/GETTING_STARTED.en.md \
            docs/ARCHITECTURE.md \
            docs/ARCHITECTURE.en.md \
            docs/GLOSSARY.md \
            docs/GLOSSARY.en.md \
            docs/RELEASE_POLICY.md \
            docs/RELEASE_POLICY.en.md \
            CONTRIBUTING.md; do
            git cat-file -e "$RELEASE_TARGET:$doc"
          done

          WT="$(mktemp -d)"
          trap 'git worktree remove --force "$WT" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$WT" "$RELEASE_TARGET"
          (cd "$WT" && python scripts/validate_repo.py && python -m unittest discover -s tests -v)

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${{ steps.state.outputs.initial }}" == "true" ]]; then
            if [[ "$live_main" != "$TARGET_SHA" || "$RELEASE_TARGET" != "$TARGET_SHA" ]]; then
              echo "Late stale-main guard failed." >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$RELEASE_TARGET" "$live_main"; then
            echo "Recovery target is no longer an ancestor of live main." >&2
            exit 1
          fi

      - name: Publish immutable repository release
        if: steps.state.outputs.complete != 'true'
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/repository.md <<'EOF'
          Repository 1.0.5 — documentation UX and release-governance maintenance.

          - Root RU/EN README is now human-first: purpose, plugin selection, quick start, workflow, safety boundaries, and documentation navigation are front-loaded.
          - Added bilingual Getting Started, Architecture, Glossary, and Release Policy as validator-controlled key documentation, plus a concise CONTRIBUTING entrypoint.
          - Release governance now states one current repository SemVer line, independent plugin SemVer, immutable historical codenames/tags, and a human merge/release gate beyond green CI.
          - Wordstat documentation now names the service unambiguously as Wordstat API within Yandex Search API v2 without changing runtime behavior or plugin SemVer.
          - Production plugin versions remain unchanged and no plugin tags are published by this release.
          EOF

          remote_tag_exists() {
            local tag="$1" rc
            set +e
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            rc=$?
            set -e
            case "$rc" in
              0) return 0 ;;
              2) return 1 ;;
              *)
                echo "Unable to determine remote tag state for $tag (git ls-remote rc=$rc)." >&2
                exit "$rc"
                ;;
            esac
          }

          rollback_published_release() {
            local tag="$1" original_rc="$2" probe_rc cleanup_release_immutable
            trap - ERR
            set +e
            if [[ "$rollback_armed" != "true" ]]; then
              exit "$original_rc"
            fi
            rollback_armed=false
            cleanup_release_immutable="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable' 2>/dev/null || true)"
            if [[ "$cleanup_release_immutable" == "true" ]]; then
              echo "Release $tag is already immutable; rollback is neither required nor safe." >&2
              exit "$original_rc"
            fi
            echo "Publication verification failed for $tag; attempting fail-closed cleanup." >&2
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Rollback residue: release $tag remains." >&2
            fi
            git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1
            probe_rc=$?
            if [[ "$probe_rc" -eq 0 ]]; then
              echo "Rollback residue: tag $tag remains." >&2
            elif [[ "$probe_rc" -ne 2 ]]; then
              echo "Rollback verification could not determine tag state for $tag (rc=$probe_rc)." >&2
            fi
            exit "$original_rc"
          }

          publish_one() {
            local tag="$1" title="$2" notes="$3"
            local state="" is_draft="" is_immutable="" target="" tag_sha=""
            local published_state="" published_is_draft="" published_is_immutable="" published_target_commitish=""
            local rollback_armed=false

            if state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
              if [[ "$target" != "$RELEASE_TARGET" ]]; then
                echo "$tag targets $target, expected $RELEASE_TARGET." >&2
                exit 1
              fi
              if [[ "$is_draft" != "true" ]]; then
                if [[ "$is_immutable" != "true" ]]; then
                  echo "$tag is published but mutable." >&2
                  exit 1
                fi
                git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
                tag_sha="$(git rev-list -n 1 "$tag")"
                [[ "$tag_sha" == "$RELEASE_TARGET" ]] || { echo "$tag points to $tag_sha." >&2; exit 1; }
                echo "$tag already published at exact target."
                return 0
              fi
              if remote_tag_exists "$tag"; then
                echo "Draft $tag unexpectedly has a remote tag." >&2
                exit 1
              fi
            else
              if remote_tag_exists "$tag"; then
                echo "Standalone remote tag $tag exists." >&2
                exit 1
              fi
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$RELEASE_TARGET" --title "$title" --notes-file "$notes"
              state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv')"
              IFS=$'\t' read -r is_draft target <<< "$state"
              [[ "$is_draft" == "true" && "$target" == "$RELEASE_TARGET" ]] || { echo "Invalid draft reservation for $tag." >&2; exit 1; }
              if remote_tag_exists "$tag"; then
                echo "Draft reservation $tag unexpectedly materialized a tag." >&2
                exit 1
              fi
            fi

            rollback_armed=true
            trap 'rc=$?; rollback_published_release "$tag" "$rc"' ERR
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --target "$RELEASE_TARGET" --title "$title" --notes-file "$notes"
            published_state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
            IFS=$'\t' read -r published_is_draft published_is_immutable published_target_commitish <<< "$published_state"

            if [[ "$published_is_draft" == "true" ]]; then
              echo "Release $tag remained a draft after publication." >&2
              trap - ERR
              rollback_published_release "$tag" 1
            fi
            if [[ "$published_is_immutable" != "true" ]]; then
              echo "$tag did not become immutable; rolling back before failing closed." >&2
              trap - ERR
              rollback_published_release "$tag" 1
            fi

            rollback_armed=false
            trap - ERR

            if [[ "$published_target_commitish" != "$RELEASE_TARGET" ]]; then
              echo "Published immutable release $tag targets $published_target_commitish, expected $RELEASE_TARGET." >&2
              exit 1
            fi
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            tag_sha="$(git rev-list -n 1 "$tag")"
            [[ "$tag_sha" == "$RELEASE_TARGET" ]] || { echo "$tag points to $tag_sha, expected $RELEASE_TARGET." >&2; exit 1; }
          }

          git fetch origin main --prune
          live_main="$(git rev-parse origin/main)"
          if [[ "${{ steps.state.outputs.initial }}" == "true" ]]; then
            [[ "$live_main" == "$TARGET_SHA" && "$RELEASE_TARGET" == "$TARGET_SHA" ]] || { echo "Late publication stale-main guard failed." >&2; exit 1; }
          else
            git merge-base --is-ancestor "$RELEASE_TARGET" "$live_main" || { echo "Late recovery ancestry guard failed." >&2; exit 1; }
          fi

          publish_one "1.0.5" "Repository 1.0.5" /tmp/repository.md

      - name: Verify complete immutable release set
        env:
          RELEASE_TARGET: ${{ steps.state.outputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "1.0.5"; do
            state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
            IFS=$'\t' read -r is_draft is_immutable target <<< "$state"
            [[ "$is_draft" != "true" && "$is_immutable" == "true" && "$target" == "$RELEASE_TARGET" ]]
            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            [[ "$(git rev-list -n 1 "$tag")" == "$RELEASE_TARGET" ]]
          done
