name: Publish repository 1.0.2 release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified repository 1.0.2 release
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect immutable repository 1.0.2 release state
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tag="1.0.2"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Release $tag exists but its tag is unavailable after fetch." >&2
              exit 1
            fi
            released_sha="$(git rev-list -n 1 "$tag")"
            if ! git merge-base --is-ancestor "$released_sha" "$TARGET_SHA"; then
              echo "Published repository 1.0.2 commit $released_sha is not an ancestor of current main $TARGET_SHA" >&2
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "released_sha=$released_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_published=false" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            existing_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "Unreleased tag $tag points to $existing_sha, expected $TARGET_SHA" >&2
              exit 1
            fi
          fi

      - name: Report already-published repository release
        if: steps.release_state.outputs.already_published == 'true'
        shell: bash
        run: |
          echo "Repository release 1.0.2 already published; no-op."
          echo "Published commit: ${{ steps.release_state.outputs.released_sha }}"

      - name: Verify exact release target
        if: steps.release_state.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -F '"version": "1.0.1"' plugins/yandex-direct/.codex-plugin/plugin.json
          grep -F '"version": "1.0.2"' plugins/yandex-metrika/.codex-plugin/plugin.json
          grep -F '"version": "1.0.3"' plugins/yandex-webmaster/.codex-plugin/plugin.json
          grep -F '"version": "1.1.1"' plugins/yandex-wordstat/.codex-plugin/plugin.json
          grep -F '"version": "1.0.2"' plugins/yandex-search/.codex-plugin/plugin.json
          grep -F '"version": "1.1.1"' plugins/yandex-seo/.codex-plugin/plugin.json
          grep -F '"version": "1.1.0"' plugins/yandex-marketing/.codex-plugin/plugin.json
          grep -F '## [1.0.2] — 2026-09-03' CHANGELOG.md
          grep -F '## [1.0.2] — 2026-09-03' CHANGELOG.en.md
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v
          python scripts/check_reference_freshness.py

      - name: Publish repository release
        if: steps.release_state.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          cat > /tmp/repository-1.0.2.md <<'EOF'
          Repository 1.0.2 is a maintenance release for release-infrastructure hardening.

          Repository changes:
          - the legacy OPUS 1.1.1 publisher now treats a complete historical release set at one ancestor commit as a verified no-op on later main pushes;
          - partial OPUS release sets resume against their already-published common SHA;
          - inconsistent or multi-SHA historical release state remains a hard failure;
          - historical OPUS/plugin tags are never retargeted;
          - regression coverage pins the immutable/idempotent publisher contract.

          Plugin versions are unchanged:
          - Yandex Direct 1.0.1
          - Yandex Metrika 1.0.2
          - Yandex Webmaster 1.0.3
          - Yandex Wordstat 1.1.1
          - Yandex Search 1.0.2
          - Yandex SEO 1.1.1
          - Yandex Marketing 1.1.0
          EOF

          if git show-ref --verify --quiet refs/tags/1.0.2; then
            gh release create "1.0.2" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Yandex AI Plugins 1.0.2 — Release Infrastructure Hardening" \
              --notes-file /tmp/repository-1.0.2.md
          else
            gh release create "1.0.2" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Yandex AI Plugins 1.0.2 — Release Infrastructure Hardening" \
              --notes-file /tmp/repository-1.0.2.md
          fi
