name: Verify draft release tag materialization

on:
  push:
    branches:
      - fix/opus-1.1.3-release-runtime

permissions:
  contents: write

jobs:
  verify:
    name: Verify draft release tag behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe draft and publish behavior, then clean up
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="__opus-1.1.3-publish-canary-${GITHUB_RUN_ID}"
          cleanup() {
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Draft/publish immutability canary" \
            --notes "Temporary canary for OPUS 1.1.3 publisher runtime hardening."

          draft_state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
          echo "draft_state=$draft_state"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent >/dev/null 2>&1; then
            echo "DRAFT_TAG_MATERIALIZED=true"
            exit 1
          fi
          echo "DRAFT_TAG_MATERIALIZED=false"

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

          published_state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish --jq '[.isDraft,.isImmutable,.targetCommitish] | @tsv')"
          echo "published_state=$published_state"
          published_immutable="$(cut -f2 <<< "$published_state")"
          published_target="$(cut -f3 <<< "$published_state")"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          echo "PUBLISHED_IMMUTABLE=$published_immutable"
          echo "PUBLISHED_TARGET=$published_target"
          echo "PUBLISHED_TAG_SHA=$tag_sha"

          test "$published_target" = "$GITHUB_SHA"
          test "$tag_sha" = "$GITHUB_SHA"
