name: Verify draft release tag reservation

on:
  push:
    branches:
      - fix/opus-1.1.3-release-runtime

permissions:
  contents: write

jobs:
  verify:
    name: Verify draft release tag reservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe whether a draft reserves its future tag name, then clean up
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="__opus-1.1.3-reservation-canary-${GITHUB_RUN_ID}"
          alternate_sha="$(git rev-parse HEAD^)"
          cleanup() {
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Draft tag reservation canary" \
            --notes "Temporary canary for OPUS 1.1.3 publisher runtime hardening."

          if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$alternate_sha" >/dev/null 2>&1; then
            echo "DRAFT_TAG_RESERVED=false"
            observed_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            echo "INJECTED_TAG_SHA=$observed_sha"
            test "$observed_sha" = "$alternate_sha"
          else
            echo "DRAFT_TAG_RESERVED=true"
          fi
