name: Publish OPUS 1.1.2 releases

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified OPUS 1.1.2 releases
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect immutable OPUS 1.1.2 release state
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tags=(
            "opus-1.1.2"
            "yandex-metrika-v1.0.3"
          )
          release_count=0
          release_shas=()

          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_count=$((release_count + 1))
              if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                echo "Release $tag exists but its tag is unavailable after fetch." >&2
                exit 1
              fi
              release_shas+=("$(git rev-list -n 1 "$tag")")
            fi
          done

          echo "release_count=$release_count" >> "$GITHUB_OUTPUT"
          printf 'release_shas=%s\n' "$(IFS=,; echo "${release_shas[*]}")" >> "$GITHUB_OUTPUT"

          if [[ "$release_count" -eq 0 ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "partial_release=false" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          released_sha="${release_shas[0]}"
          for sha in "${release_shas[@]}"; do
            if [[ "$sha" != "$released_sha" ]]; then
              echo "Existing OPUS 1.1.2 releases point to multiple commits: ${release_shas[*]}" >&2
              exit 1
            fi
          done

          if ! git merge-base --is-ancestor "$released_sha" "$TARGET_SHA"; then
            echo "Published OPUS 1.1.2 commit $released_sha is not an ancestor of current main $TARGET_SHA" >&2
            exit 1
          fi

          echo "released_sha=$released_sha" >> "$GITHUB_OUTPUT"
          echo "release_target_sha=$released_sha" >> "$GITHUB_OUTPUT"

          if [[ "$release_count" -eq "${#tags[@]}" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "partial_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "partial_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report already-published release set
        if: steps.release_state.outputs.already_published == 'true'
        shell: bash
        run: |
          echo "OPUS 1.1.2 release set already published; no-op."
          echo "Published commit: ${{ steps.release_state.outputs.released_sha }}"

      - name: Report partial release recovery
        if: steps.release_state.outputs.partial_release == 'true'
        shell: bash
        run: |
          echo "Partial OPUS 1.1.2 release set detected; resuming at immutable commit."
          echo "Release target: ${{ steps.release_state.outputs.release_target_sha }}"
          echo "Current main: $TARGET_SHA"

      - name: Verify exact release target
        if: steps.release_state.outputs.already_published != 'true'
        env:
          RELEASE_TARGET_SHA: ${{ steps.release_state.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$RELEASE_TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_TARGET_SHA" "$TARGET_SHA"

          git show "$RELEASE_TARGET_SHA:plugins/yandex-direct/.codex-plugin/plugin.json" | grep -F '"version": "1.0.1"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-metrika/.codex-plugin/plugin.json" | grep -F '"version": "1.0.3"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-webmaster/.codex-plugin/plugin.json" | grep -F '"version": "1.0.3"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-wordstat/.codex-plugin/plugin.json" | grep -F '"version": "1.1.1"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-search/.codex-plugin/plugin.json" | grep -F '"version": "1.0.2"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-seo/.codex-plugin/plugin.json" | grep -F '"version": "1.1.1"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-marketing/.codex-plugin/plugin.json" | grep -F '"version": "1.1.0"'
          git show "$RELEASE_TARGET_SHA:CHANGELOG.md" | grep -F '## [OPUS 1.1.2] — 2026-09-03'
          git show "$RELEASE_TARGET_SHA:CHANGELOG.en.md" | grep -F '## [OPUS 1.1.2] — 2026-09-03'
          git show "$RELEASE_TARGET_SHA:docs/superpowers/specs/2026-09-03-opus-1.1.2-residual-audit-hardening-amendment.md" >/dev/null

          RELEASE_WORKTREE="$(mktemp -d)"
          trap 'git worktree remove --force "$RELEASE_WORKTREE" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$RELEASE_WORKTREE" "$RELEASE_TARGET_SHA"
          (cd "$RELEASE_WORKTREE"
            python scripts/validate_repo.py
            python -m unittest discover -s tests -v
            python scripts/check_reference_freshness.py
          )

      - name: Publish repository and plugin releases
        if: steps.release_state.outputs.already_published != 'true'
        env:
          RELEASE_TARGET_SHA: ${{ steps.release_state.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes_file="$3"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              existing_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$existing_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Existing release $tag points to $existing_sha, expected $RELEASE_TARGET_SHA" >&2
                exit 1
              fi
              echo "Release $tag already exists at the expected immutable commit."
              return 0
            fi

            if git show-ref --verify --quiet "refs/tags/$tag"; then
              existing_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$existing_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Existing tag $tag points to $existing_sha, expected $RELEASE_TARGET_SHA" >&2
                exit 1
              fi
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$title" \
                --notes-file "$notes_file"
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$RELEASE_TARGET_SHA" \
                --title "$title" \
                --notes-file "$notes_file"
            fi
          }

          cat > /tmp/opus-1.1.2.md <<'EOF'
          OPUS 1.1.2 closes the remaining actionable tail from the final Opus 5 audit.

          Highlights:
          - Yandex Metrika 1.0.3 closes the residual Direct expense provenance gap for CSV files without UTM fields;
          - official TrafficSourceDetail=yandex_direct_star is treated as proven Direct cost provenance;
          - insufficient expense provenance fails closed as DIRECT_SOURCE_UNVERIFIED and requires explicit reviewed override;
          - explicit non-Direct source details remain allowed without inventing source identity from arbitrary provider labels;
          - shared runtime promotion now requires a safe installability/distribution contract in addition to repetition and a stable interface;
          - N3, N5, N6, and N8 remain resolved by the existing traceability, marketplace-auth, Webmaster archive, and Marketing taxonomy contracts.

          Published plugin matrix:
          - Yandex Direct 1.0.1 (unchanged)
          - Yandex Metrika 1.0.3
          - Yandex Webmaster 1.0.3 (unchanged)
          - Yandex Wordstat 1.1.1 (unchanged)
          - Yandex Search 1.0.2 (unchanged)
          - Yandex SEO 1.1.1 (unchanged)
          - Yandex Marketing 1.1.0 (unchanged)
          EOF

          cat > /tmp/metrika-1.0.3.md <<'EOF'
          Yandex Metrika 1.0.3 hardens expense-import source provenance:
          - classifies CSV source evidence as DIRECT, NON_DIRECT, or UNVERIFIED;
          - detects official TrafficSourceDetail=yandex_direct_star even without UTMSource/UTMMedium;
          - raises DIRECT_DUPLICATION_RISK for proven Direct provenance;
          - raises DIRECT_SOURCE_UNVERIFIED when the file lacks enough evidence to rule Direct out;
          - keeps explicit non-Direct source detail valid and preserves the explicit --allow-direct-risk review override.
          EOF

          publish_release "opus-1.1.2" "OPUS 1.1.2 — Residual Audit Hardening" /tmp/opus-1.1.2.md
          publish_release "yandex-metrika-v1.0.3" "Yandex Metrika 1.0.3" /tmp/metrika-1.0.3.md
