name: Publish OPUS 1.1.1 releases

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified OPUS 1.1.1 releases
    if: >-
      github.repository == 'trafficolog/yandex-ai-plugins-skills' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Detect immutable OPUS 1.1.1 release state
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tags=(
            "opus-1.1.1"
            "yandex-metrika-v1.0.2"
            "yandex-webmaster-v1.0.3"
          )
          release_count=0
          release_shas=()

          for tag in "${tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_count=$((release_count + 1))
              if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                echo "Release $tag exists but its tag is unavailable after fetch." >&2
                exit 1
              fi
              release_shas+=("$(git rev-list -n 1 "$tag")")
            fi
          done

          echo "release_count=$release_count" >> "$GITHUB_OUTPUT"
          printf 'release_shas=%s\n' "$(IFS=,; echo "${release_shas[*]}")" >> "$GITHUB_OUTPUT"

          if [[ "$release_count" -eq 0 ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "partial_release=false" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          released_sha="${release_shas[0]}"
          for sha in "${release_shas[@]}"; do
            if [[ "$sha" != "$released_sha" ]]; then
              echo "Existing OPUS 1.1.1 releases point to multiple commits: ${release_shas[*]}" >&2
              exit 1
            fi
          done

          if ! git merge-base --is-ancestor "$released_sha" "$TARGET_SHA"; then
            echo "Published OPUS 1.1.1 commit $released_sha is not an ancestor of current main $TARGET_SHA" >&2
            exit 1
          fi

          echo "released_sha=$released_sha" >> "$GITHUB_OUTPUT"
          echo "release_target_sha=$released_sha" >> "$GITHUB_OUTPUT"

          if [[ "$release_count" -eq "${#tags[@]}" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "partial_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "partial_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report already-published release set
        if: steps.release_state.outputs.already_published == 'true'
        shell: bash
        run: |
          echo "OPUS 1.1.1 release set already published; no-op."
          echo "Published commit: ${{ steps.release_state.outputs.released_sha }}"

      - name: Report partial release recovery
        if: steps.release_state.outputs.partial_release == 'true'
        shell: bash
        run: |
          echo "Partial OPUS 1.1.1 release set detected; resuming at immutable commit."
          echo "Release target: ${{ steps.release_state.outputs.release_target_sha }}"
          echo "Current main: $TARGET_SHA"

      - name: Verify exact release target
        if: steps.release_state.outputs.already_published != 'true'
        env:
          RELEASE_TARGET_SHA: ${{ steps.release_state.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$RELEASE_TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_TARGET_SHA" "$TARGET_SHA"
          git show "$RELEASE_TARGET_SHA:plugins/yandex-metrika/.codex-plugin/plugin.json" | grep -F '"version": "1.0.2"'
          git show "$RELEASE_TARGET_SHA:plugins/yandex-webmaster/.codex-plugin/plugin.json" | grep -F '"version": "1.0.3"'
          git show "$RELEASE_TARGET_SHA:CHANGELOG.md" | grep -F '## [OPUS 1.1.1] — 2026-09-02'
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v
          python scripts/check_reference_freshness.py

      - name: Publish repository and plugin releases
        if: steps.release_state.outputs.already_published != 'true'
        env:
          RELEASE_TARGET_SHA: ${{ steps.release_state.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          publish_release() {
            local tag="$1"
            local title="$2"
            local notes_file="$3"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              existing_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$existing_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Existing release $tag points to $existing_sha, expected $RELEASE_TARGET_SHA" >&2
                exit 1
              fi
              echo "Release $tag already exists at the expected immutable commit."
              return 0
            fi

            if git show-ref --verify --quiet "refs/tags/$tag"; then
              existing_sha="$(git rev-list -n 1 "$tag")"
              if [[ "$existing_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Existing tag $tag points to $existing_sha, expected $RELEASE_TARGET_SHA" >&2
                exit 1
              fi
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$title" \
                --notes-file "$notes_file"
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$RELEASE_TARGET_SHA" \
                --title "$title" \
                --notes-file "$notes_file"
            fi
          }

          cat > /tmp/opus.md <<'EOF'
          OPUS 1.1.1 is the final Opus 5 review follow-up fix release.

          Published plugin matrix:
          - Yandex Direct 1.0.1 (unchanged)
          - Yandex Metrika 1.0.2
          - Yandex Webmaster 1.0.3
          - Yandex Wordstat 1.0.2 (unchanged)
          - Yandex Search 1.0.2 (unchanged)
          - Yandex SEO 1.0.1 (unchanged)
          - Yandex Marketing 1.1.0 (unchanged)

          Highlights:
          - diff-aware API-reference freshness enforcement for PR/push plus a weekly strict freshness issue workflow;
          - explicit high-risk blocker traceability with the matrix documented as an index rather than semantic proof;
          - stronger two-layer Metrika Direct-expense duplication protection for human source labels and CSV UTM evidence;
          - verified Webmaster indexing archive `state` lifecycle contract from official Yandex documentation;
          - explicit transport-free `ON_USE` deferred-auth semantics for SEO/Marketing marketplace entries;
          - Marketing design taxonomy reconciled with the nine executable local finding types and explicit deferred set.
          EOF

          cat > /tmp/metrika.md <<'EOF'
          Yandex Metrika 1.0.2 hardens the Direct-expense duplication guard:
          - human source labels are tokenized conservatively, covering labels such as `Yandex Direct RU`, `direct_ads`, and `Яндекс Директ агентство`;
          - substring-only labels such as `MyDirect` are not treated as proven Direct provenance;
          - CSV UTM source/medium inspection remains an independent second risk layer;
          - the guard is pinned in the repository contract traceability matrix and bilingual documentation.
          EOF

          cat > /tmp/webmaster.md <<'EOF'
          Yandex Webmaster 1.0.3 pins the official indexing archive lifecycle contract:
          - archive status is read from documented field `state`;
          - documented states are `IN_PROGRESS`, `DONE`, and `FAILED`;
          - `download_url` is required for a completed downloadable archive;
          - regression coverage rejects unverified `status`-only payload assumptions;
          - no runtime change was made where the existing implementation was already correct.
          EOF

          publish_release "opus-1.1.1" "OPUS 1.1.1 — Final Review Follow-up" /tmp/opus.md
          publish_release "yandex-metrika-v1.0.2" "Yandex Metrika 1.0.2" /tmp/metrika.md
          publish_release "yandex-webmaster-v1.0.3" "Yandex Webmaster 1.0.3" /tmp/webmaster.md
